<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOME MARKETPLACE</title>
  </head>
  <body>
    <p>Ouverture de LOME MARKETPLACE…</p>
    <p>Si la redirection ne fonctionne pas, <a href="/preview.html">ouvrez la marketplace</a>.</p>
    <script>
      const isLocalDevelopment = ['localhost', '127.0.0.1'].includes(window.location.hostname);
      if (isLocalDevelopment && window.location.port !== '8080') {
        window.location.replace('http://127.0.0.1:8080/');
      } else {
        window.location.replace('/preview.html');
      }
    </script>
  </body>
</html>
